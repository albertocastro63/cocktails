name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run frontend tests with coverage
        run: cd frontend && npm test -- --coverage

      - name: Build frontend
        run: cd frontend && npm run build

  backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    services:
      dynamodb-local:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -s http://localhost:8000 > /dev/null"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC)
        if: vars.AWS_CI_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run backend tests with coverage
        run: |
          cd backend
          go test -coverprofile=coverage.out -coverpkg=./internal/... ./...
          go tool cover -func=coverage.out
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${COVERAGE}%"
          awk "BEGIN{if(${COVERAGE}+0 < 75){print \"FAIL: coverage \" ${COVERAGE} \"% is below the 75% threshold\"; exit 1}else{print \"PASS: coverage \" ${COVERAGE} \"% meets 75% threshold\"}}"

      - name: Build Lambda binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/bootstrap ./cmd/lambda/
