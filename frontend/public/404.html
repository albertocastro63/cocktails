<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Cocktail Recipes</title>
    <style>
      :root {
        --stone-900: #1c1917;
        --stone-500: #78716c;
        --stone-200: #e7e5e4;
        --stone-50: #fafaf9;
        --amber-700: #b45309;
        --amber-800: #92400e;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--stone-50);
        color: var(--stone-900);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .brand {
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--amber-700);
        font-weight: 600;
        margin-bottom: 1.5rem;
      }
      .code {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1;
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0.75rem 0 0.5rem;
      }
      p {
        color: var(--stone-500);
        margin: 0 0 1.75rem;
      }
      .home-link {
        display: inline-block;
        background: var(--amber-700);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
      }
      .home-link:hover { background: var(--amber-800); }
      .home-link:focus-visible {
        outline: 3px solid var(--amber-800);
        outline-offset: 2px;
      }
      hr { border: 0; border-top: 1px solid var(--stone-200); margin: 2rem auto 0; width: 4rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Cocktail Recipes</p>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>That page doesn&rsquo;t exist. It may have been removed, or the link may be incorrect.</p>
      <a class="home-link" href="/">Back to home</a>
      <hr />
    </main>
  </body>
</html>
